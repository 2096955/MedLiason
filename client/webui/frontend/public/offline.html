<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#015B82" />
        <title>MedExpert - Offline</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --color-bg: #ffffff;
                --color-text: #1a1a2e;
                --color-text-secondary: #4a4a6a;
                --color-brand: #015b82;
                --color-brand-light: #0ea5e9;
                --color-surface: #f0f4f8;
                --color-border: #d1d9e6;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --color-bg: #0f172a;
                    --color-text: #e2e8f0;
                    --color-text-secondary: #94a3b8;
                    --color-brand: #38bdf8;
                    --color-brand-light: #0ea5e9;
                    --color-surface: #1e293b;
                    --color-border: #334155;
                }
            }

            html,
            body {
                height: 100%;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background-color: var(--color-bg);
                color: var(--color-text);
            }

            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 2rem;
                text-align: center;
            }

            .icon {
                width: 80px;
                height: 80px;
                margin-bottom: 1.5rem;
                opacity: 0.6;
            }

            .icon svg {
                width: 100%;
                height: 100%;
            }

            h1 {
                font-size: 1.75rem;
                font-weight: 700;
                margin-bottom: 0.5rem;
                color: var(--color-brand);
            }

            .subtitle {
                font-size: 1rem;
                color: var(--color-text-secondary);
                margin-bottom: 2rem;
            }

            .warning-card {
                max-width: 520px;
                background-color: var(--color-surface);
                border: 1px solid var(--color-border);
                border-radius: 12px;
                padding: 1.5rem;
                margin-bottom: 2rem;
                text-align: left;
            }

            .warning-card h2 {
                font-size: 0.875rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--color-brand);
                margin-bottom: 0.75rem;
            }

            .warning-card p {
                font-size: 0.9375rem;
                line-height: 1.6;
                color: var(--color-text-secondary);
            }

            .retry-button {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.75rem 2rem;
                font-size: 1rem;
                font-weight: 600;
                color: #ffffff;
                background-color: var(--color-brand);
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition:
                    background-color 0.2s ease,
                    transform 0.1s ease;
            }

            .retry-button:hover {
                background-color: var(--color-brand-light);
            }

            .retry-button:active {
                transform: scale(0.97);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="currentColor" opacity="0.15" />
                    <path
                        d="M50 20v60M20 50h60"
                        stroke="currentColor"
                        stroke-width="8"
                        stroke-linecap="round"
                        opacity="0.4"
                    />
                    <circle cx="50" cy="50" r="20" fill="none" stroke="currentColor" stroke-width="3" opacity="0.3" />
                </svg>
            </div>

            <h1>You're Offline</h1>
            <p class="subtitle">MedExpert requires an internet connection.</p>

            <div class="warning-card">
                <h2>Why no cached results?</h2>
                <p>
                    Medical research relies on real-time access to PubMed, clinical trials databases, FDA data, and
                    other authoritative sources. Cached results are not served to ensure you always receive the most
                    current evidence.
                </p>
            </div>

            <button class="retry-button" onclick="window.location.reload()">Try Again</button>
        </div>
    </body>
</html>
