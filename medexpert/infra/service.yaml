apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: medliaison
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 600
      containers:
        # Main container: MedExpert (Redis + 10 MCP + Memgraph MCP client + 13 agents + gateway)
        - name: medexpert
          image: gcr.io/gbg-neuro/medliaison:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              memory: "16Gi"
              cpu: "8"
          env:
            - name: SOLACE_DEV_MODE
              value: "true"
            - name: NAMESPACE
              value: "medexpert/"
            - name: VERTEXAI_PROJECT
              value: "gbg-neuro"
            - name: VERTEXAI_LOCATION
              value: "us-central1"
            - name: FASTAPI_HOST
              value: "0.0.0.0"
            - name: FASTAPI_PORT
              value: "8080"
            - name: REDIS_URL
              value: "redis://localhost:6379"
            - name: MEMGRAPH_URL
              value: "bolt://localhost:7687"
            - name: SESSION_SECRET_KEY
              value: "medliaison-demo-session-key"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 40
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10

        # Sidecar: Memgraph graph database
        - name: memgraph
          image: memgraph/memgraph:latest
          ports:
            - containerPort: 7687
          resources:
            limits:
              memory: "4Gi"
              cpu: "2"
          env:
            - name: MEMGRAPH_USER
              value: "memgraph"
            - name: MEMGRAPH_PASSWORD
              value: ""
