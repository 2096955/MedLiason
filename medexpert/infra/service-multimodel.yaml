apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: medliaison-multimodel
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/container-dependencies: '{"medexpert":["memgraph"]}'
    spec:
      # Service account must have:
      #   - Vertex AI User role (for Gemini models)
      #   - Anthropic model access enabled in the project (for Claude Opus 4.6)
      # The existing medliaison service uses the default Compute Engine SA.
      # If Opus calls return 403, grant the SA explicit Anthropic model access
      # via: gcloud ai models add-iam-policy-binding or Cloud Console > Model Garden.
      serviceAccountName: healthcare-poc-vertexai@gbg-neuro.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 600
      containers:
        # Main container: MedExpert Multi-Model
        # 39 agents (3 stacks x 13) + 10 MCP servers + Redis + gateway
        - name: medexpert
          image: gcr.io/gbg-neuro/medliaison-multimodel:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              memory: "16Gi"
              cpu: "6"
          env:
            - name: SOLACE_DEV_MODE
              value: "true"
            - name: NAMESPACE
              value: "medexpert/"
            - name: VERTEXAI_PROJECT
              value: "gbg-neuro"
            - name: VERTEXAI_LOCATION
              # Set to "global" — serves all models (Flash, Pro, Opus).
              # Per-call vertex_location kwargs from shared_config are ignored
              # by litellm; the env var is the only reliable override.
              value: "global"
            - name: FASTAPI_HOST
              value: "0.0.0.0"
            - name: FASTAPI_PORT
              value: "8080"
            - name: REDIS_URL
              value: "redis://localhost:6379"
            - name: MEMGRAPH_URL
              value: "bolt://localhost:7687"
            - name: MEMGRAPH_USER
              value: "memgraph"
            - name: MEMGRAPH_PASSWORD
              value: "medexpert-demo"
            - name: SESSION_SECRET_KEY
              value: "medliaison-multimodel-demo-key"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            # 39 agents take ~3x longer to start than 13
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 60
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10

        # Sidecar: Memgraph graph database
        - name: memgraph
          image: memgraph/memgraph:latest
          args: ["--also-log-to-stderr", "--log-level=WARNING"]
          resources:
            limits:
              memory: "4Gi"
              cpu: "2"
          env:
            - name: MEMGRAPH_USER
              value: "memgraph"
            - name: MEMGRAPH_PASSWORD
              value: "medexpert-demo"
          startupProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
            timeoutSeconds: 3
