steps:
  # Build MCP image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/medexpert-mcp:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/medexpert-mcp:latest"
      - "-f"
      - "infra/Dockerfile.mcp"
      - "."
    dir: "medexpert"

  # Push to GCR
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/medexpert-mcp:$COMMIT_SHA"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/medexpert-mcp:latest"]

  # Deploy PubMed MCP to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    args:
      - "gcloud"
      - "run"
      - "deploy"
      - "medexpert-mcp-pubmed"
      - "--image=gcr.io/$PROJECT_ID/medexpert-mcp:$COMMIT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--port=9001"
      - "--no-allow-unauthenticated"

images:
  - "gcr.io/$PROJECT_ID/medexpert-mcp:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/medexpert-mcp:latest"

timeout: "600s"
