apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-pubmed
  namespace: medexpert
  labels:
    app: medexpert
    component: mcp
    server: pubmed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medexpert
      server: pubmed
  template:
    metadata:
      labels:
        app: medexpert
        component: mcp
        server: pubmed
    spec:
      containers:
        - name: mcp-pubmed
          image: medexpert-mcp:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "mcp_servers.pubmed.server"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 9001
          env:
            - name: MCP_PORT
              value: "9001"
          envFrom:
            - secretRef:
                name: medexpert-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 9001
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-pubmed
  namespace: medexpert
spec:
  selector:
    app: medexpert
    server: pubmed
  ports:
    - port: 9001
      targetPort: 9001
# Repeat for other MCP servers (ports 9002-9013).
# In production, use Kustomize or Helm to template.
