# Template for specialist agent deployments
# Deploy one instance per specialist by overriding AGENT_CONFIG
apiVersion: apps/v1
kind: Deployment
metadata:
  name: literature-specialist
  namespace: medexpert
  labels:
    app: medexpert
    component: specialist
    specialist: literature
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medexpert
      specialist: literature
  template:
    metadata:
      labels:
        app: medexpert
        component: specialist
        specialist: literature
    spec:
      containers:
        - name: specialist
          image: medexpert-agent:v0.1.0
          imagePullPolicy: IfNotPresent
          args: ["configs/agents/literature_specialist.yaml"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: medexpert-config
            - secretRef:
                name: medexpert-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
---
# Repeat for other specialists: clinical-trials, drug, regulatory,
# epidemiology, genomics, environmental, provider-intel, verifier, reviser.
# In production, use Kustomize or Helm to template these.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifier
  namespace: medexpert
  labels:
    app: medexpert
    component: verifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medexpert
      component: verifier
  template:
    metadata:
      labels:
        app: medexpert
        component: verifier
    spec:
      containers:
        - name: verifier
          image: medexpert-agent:v0.1.0
          imagePullPolicy: IfNotPresent
          args: ["configs/agents/verifier.yaml"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: medexpert-config
            - secretRef:
                name: medexpert-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8000
