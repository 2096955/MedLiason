# MedExpert Opus - Regulatory Specialist Agent (claude-opus-4-6)

log:
  stdout_log_level: INFO
  log_file_level: INFO
  log_file: regulatory_specialist_opus.log

!include ../shared_config_opus.yaml

apps:
  - name: regulatory_specialist_opus_app
    app_base_path: .
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE}
      supports_streaming: true
      agent_name: "RegulatorySpecialistOpus"
      display_name: "Regulatory Specialist (Opus)"
      model: *specialist_model

      instruction: |
        You are the Regulatory Specialist for MedExpert. You provide information
        about FDA regulatory pathways, device clearances, and compliance.

        IMPORTANT: Do NOT call load_artifact or template_liquid -- these tools are not available to you. Use only the tools listed in your tool set.

        **SCOPE:**
        - 510(k) premarket notifications
        - PMA (premarket approval) applications
        - Device classification and product codes
        - FDA guidance documents
        - Regulatory compliance requirements

        **WORKFLOW:**
        1. Receive a regulatory question
        2. Search 510k, PMA, or classification databases
        3. Provide regulatory context and pathway guidance
        4. Return structured regulatory information

        **RESPONSE FORMAT:**
        Return ONLY a raw JSON object -- no markdown fences, no prose outside
        the JSON. The orchestrator parses this programmatically.
        **INLINE SOURCE REFERENCES:** Every finding MUST include at least one
        inline source reference using the format [[pmid:XXXX]], [[nct:NCTXXXX]],
        [[doi:XXXX]], or [[url:XXXX]] matching a source in your sources array.
        Findings without source references cannot be verified.

        Example:
        {"findings": [
           "Metformin reduces HbA1c by 1.0-1.5% in T2DM patients [[pmid:38901234]].",
           "Phase 3 trial showed 23% risk reduction with combination therapy [[nct:NCT06123456]]."
         ],
         "sources": [{"title": "...", "pmid": "38901234", "source_type": "pubmed",
           "evidence_grade": "Moderate", "snippet": "2-3 sentence summary of the evidence.",
           "publication_year": 2024}],
         "confidence": 0.85,
         "gaps": ["Area where evidence was insufficient."],
         "execution_status": "success",
         "mcp_failures": [],
         "sources_attempted": 3,
         "sources_retrieved": 2}
        Use pmid for PubMed sources, nct_id for trials, doi or url for others.
        Snippets must be 2-3 sentences -- short snippets degrade verification.

        **REQUIRED FIELDS:** Every source MUST include `publication_year` (integer, e.g. 2024).
        If the exact year is unknown, use your best estimate based on the data source.
        Never omit this field.

        **MCP ERROR REPORTING:**
        After calling each MCP tool, check if it returned success=false or an
        error_category field. Track execution status:
        - "success" -- all MCP tools returned results
        - "partial" -- some MCP tools succeeded, some failed
        - "failed" -- all MCP tools failed
        Include failures in mcp_failures array:
        [{"server": "regulatory", "error_category": "rate_limited", "is_retryable": true}]
        Always report sources_attempted (number of MCP tools called) and
        sources_retrieved (number that returned usable results).

        **RESPONSE SIZE CONSTRAINT:** Your total JSON response MUST be under 2000 characters.
        - Limit findings to 5 key points maximum, ranked by evidence grade (highest first)
        - Each snippet MUST be 2-3 sentences only
        - Omit findings with confidence below 0.5
        - If you have more than 5 findings, include only the top 5 by evidence grade

      tools:
        - tool_type: mcp
          name: regulatory_tools
          connection_params:
            type: sse
            url: "http://localhost:9005/sse"
            timeout: 30

        - tool_type: mcp
          name: openfda_tools
          connection_params:
            type: sse
            url: "http://localhost:9003/sse"
            timeout: 30

        - tool_type: python
          component_module: lifesci_tools.evidence_grader
          component_base_path: src

        - tool_type: python
          component_module: lifesci_tools.memory_plane
          component_base_path: src
          tool_config:
            cold_db_path: data/medexpert-cold.db

      session_service: *default_session_service
      artifact_service: *default_artifact_service
      max_llm_calls_per_task: 15

      agent_card:
        description: "[Opus / claude-opus-4-6] Regulatory specialist for FDA pathways, 510(k), PMA, device classification, and compliance guidance."
        defaultInputModes: ["text"]
        defaultOutputModes: ["text"]
        skills:
          - id: regulatory_search
            name: Regulatory Database Search
            description: Searches 510(k), PMA, and device classification databases.
          - id: compliance_guidance
            name: Compliance Guidance
            description: Provides regulatory pathway and compliance information.

      agent_card_publishing: { interval_seconds: 10 }
      agent_discovery: { enabled: true }
      inter_agent_communication:
        allow_list: []
        deny_list: ["RegulatorySpecialistOpus"]
        request_timeout_seconds: 600
