# MedExpert Opus - Provider Intelligence Specialist Agent (claude-opus-4-6)

log:
  stdout_log_level: INFO
  log_file_level: INFO
  log_file: provider_intel_specialist_opus.log

!include ../shared_config_opus.yaml

apps:
  - name: provider_intel_specialist_opus_app
    app_base_path: .
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE}
      supports_streaming: true
      agent_name: "ProviderIntelSpecialistOpus"
      display_name: "Provider Intelligence Specialist (Opus)"
      model: *specialist_model

      instruction: |
        You are the Provider Intelligence Specialist for MedExpert. You provide
        information about healthcare providers, quality metrics, and financial
        transparency data.

        **DATA SOURCES:**
        - CMS Provider Data: quality ratings, specialties
        - CMS Open Payments: financial relationships with industry

        **SCOPE:**
        - Provider quality comparisons
        - Specialty and practice information
        - Industry payment transparency
        - Healthcare facility data

        **ETHICAL NOTE:** Open Payments data represents legally disclosed
        financial relationships. These should be presented neutrally without
        implying wrongdoing.

        **RESPONSE FORMAT:**
        Return ONLY a raw JSON object — no markdown fences, no prose outside
        the JSON. The orchestrator parses this programmatically.
        Example:
        {"findings": ["Key finding 1.", "Key finding 2."],
         "sources": [{"title": "...", "pmid": "38901234", "source_type": "pubmed",
           "evidence_grade": "Moderate", "snippet": "2-3 sentence summary of the evidence.",
           "publication_year": 2024}],
         "confidence": 0.85,
         "gaps": ["Area where evidence was insufficient."]}
        Use pmid for PubMed sources, nct_id for trials, doi or url for others.
        Snippets must be 2-3 sentences — short snippets degrade verification.

      tools:
        - tool_type: mcp
          name: provider_intel_tools
          connection_params:
            type: sse
            url: "http://localhost:9010/sse"
            timeout: 30

        - tool_type: python
          component_module: lifesci_tools.evidence_grader
          component_base_path: src

        - tool_type: python
          component_module: lifesci_tools.memory_plane
          component_base_path: src
          tool_config:
            cold_db_path: data/medexpert-cold.db

      session_service: *default_session_service
      artifact_service: *default_artifact_service
      max_llm_calls_per_task: 15

      agent_card:
        description: "[Opus / claude-opus-4-6] Provider intelligence specialist for healthcare provider quality data and CMS Open Payments transparency."
        defaultInputModes: ["text"]
        defaultOutputModes: ["text"]
        skills:
          - id: provider_search
            name: Provider Search
            description: Searches CMS provider quality and practice data.
          - id: payment_transparency
            name: Payment Transparency
            description: Searches CMS Open Payments financial disclosure data.

      agent_card_publishing: { interval_seconds: 10 }
      agent_discovery: { enabled: true }
      inter_agent_communication:
        allow_list: []
        deny_list: ["ProviderIntelSpecialistOpus"]
        request_timeout_seconds: 600
