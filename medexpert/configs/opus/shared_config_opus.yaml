# MedExpert Opus — hybrid config: Flash specialists, Opus synthesis/verification
# Specialists (research + data gathering) use gemini-2.5-flash for cost efficiency.
# Orchestrator, verifier, and reviser use claude-opus-4-6 for synthesis and reasoning.
#
# Rationale: specialists do structured tool calls / JSON formatting — Flash is equally
# capable. Opus synthesises a *richer* memory plane (Flash can make more tool calls
# within budget) and applies deep reasoning at the synthesis/verification layer only.
#
# IMPORTANT: claude-opus-4-6 requires LiteLLM >= 1.81.14 (.venv-pro) and the global
# Vertex AI endpoint (not regional like us-central1).

shared_config:
  - broker_connection: &broker_connection
      dev_mode: ${SOLACE_DEV_MODE, true}
      broker_url: ${SOLACE_BROKER_URL, ws://localhost:8008}
      broker_username: ${SOLACE_BROKER_USERNAME, default}
      broker_password: ${SOLACE_BROKER_PASSWORD, default}
      broker_vpn: ${SOLACE_BROKER_VPN, default}
      temporary_queue: ${USE_TEMPORARY_QUEUES, true}

  # Vertex AI ADC — claude-opus-4-6 requires global endpoint.
  # Regional endpoints (us-central1, europe-west4, etc.) return model-not-found.
  - vertex_ai:
    vertex_project: "gbg-neuro"
    vertex_location: "global"

  # ── Synthesis/reasoning tiers: claude-opus-4-6 | Research tier: gemini-2.5-flash ──
  # vertex_project and vertex_location are passed as kwargs to litellm.acompletion(),
  # overriding the VERTEXAI_LOCATION env var. This is required because the env var
  # defaults to us-central1 (for standard agents) but Opus needs the global endpoint.
  - models:
    orchestrator: &orchestrator_model
      model: "vertex_ai/claude-opus-4-6"
      vertex_project: "gbg-neuro"
      vertex_location: "global"
      temperature: 0.2
      max_tokens: 32000
      parallel_tool_calls: true
      cache_strategy: "none"
      num_retries: 3
      fallbacks:
        - "vertex_ai/gemini-2.5-pro"

    # Specialists use Flash — structured tool calls / JSON formatting don't need Opus.
    # Flash specialists can make more tool calls within the same token budget, giving
    # Opus a richer memory plane to synthesise from.
    specialist: &specialist_model
      model: "vertex_ai/gemini-2.5-flash"
      temperature: 0.3
      max_tokens: 12000
      parallel_tool_calls: true
      cache_strategy: "none"
      stream: false
      num_retries: 4
      fallbacks:
        - "vertex_ai/gemini-2.5-pro"

    advisory: &advisory_model
      model: "vertex_ai/gemini-2.5-flash"
      temperature: 0.7
      max_tokens: 12000
      cache_strategy: "none"
      num_retries: 2
      fallbacks:
        - "vertex_ai/gemini-2.5-pro"

    # Verifier intentionally has NO fallback — verification must use the
    # stronger model for factual accuracy.
    verifier: &verifier_model
      model: "vertex_ai/claude-opus-4-6"
      vertex_project: "gbg-neuro"
      vertex_location: "global"
      temperature: 0.1
      max_tokens: 8000
      cache_strategy: "none"
      num_retries: 3

    reviser: &reviser_model
      model: "vertex_ai/claude-opus-4-6"
      vertex_project: "gbg-neuro"
      vertex_location: "global"
      temperature: 0.3
      max_tokens: 12000
      cache_strategy: "none"
      num_retries: 2
      fallbacks:
        - "vertex_ai/gemini-2.5-pro"

    general: &general_model
      model: "vertex_ai/gemini-2.5-flash"
      cache_strategy: "none"

    planning: &planning_model
      model: "vertex_ai/claude-opus-4-6"
      vertex_project: "gbg-neuro"
      vertex_location: "global"
      parallel_tool_calls: true
      max_tokens: ${MAX_TOKENS, 16000}
      temperature: 0.1
      cache_strategy: "none"

  - services:
    session_service: &default_session_service
      type: "memory"

    artifact_service: &default_artifact_service
      type: "filesystem"
      base_path: "/tmp/medexpert-opus"
      artifact_scope: namespace

    data_tools_config: &default_data_tools_config
      data_tools_enabled: true
      sqlite_memory_threshold_mb: 100
      max_result_preview_rows: 50
      max_result_preview_bytes: 4096
