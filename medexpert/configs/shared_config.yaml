shared_config:
  - broker_connection: &broker_connection
      dev_mode: ${SOLACE_DEV_MODE, true}
      broker_url: ${SOLACE_BROKER_URL, ws://localhost:8008}
      broker_username: ${SOLACE_BROKER_USERNAME, default}
      broker_password: ${SOLACE_BROKER_PASSWORD, default}
      broker_vpn: ${SOLACE_BROKER_VPN, default}
      temporary_queue: ${USE_TEMPORARY_QUEUES, true}

  # ── LLM: Gemini 3.7 Flash via OpenRouter (Google AI Studio BYOK) ──
  # Set OPENROUTER_API_KEY in .env. Link a Google AI Studio key in
  # OpenRouter integrations — NOT Vertex (Vertex burns OR credits).
  # Privacy: allow Google to see prompts at openrouter.ai/settings/privacy.
  #
  # The extra_body.provider block pins every call to AI Studio BYOK.
  # Do NOT remove it or add allow_fallbacks: true.

  - openrouter_provider: &openrouter_provider
      provider:
        only:
          - "google-ai-studio"
        allow_fallbacks: false

  - models:
    orchestrator: &orchestrator_model
      model: "openrouter/google/gemini-3.7-flash"
      temperature: 0.2
      max_tokens: 32000
      parallel_tool_calls: true
      num_retries: 3
      extra_body:
        <<: *openrouter_provider

    specialist: &specialist_model
      model: "openrouter/google/gemini-3.7-flash"
      temperature: 0.3
      max_tokens: 12000
      parallel_tool_calls: true
      stream: false
      num_retries: 4
      extra_body:
        <<: *openrouter_provider

    advisory: &advisory_model
      model: "openrouter/google/gemini-3.7-flash"
      temperature: 0.7
      max_tokens: 12000
      num_retries: 2
      extra_body:
        <<: *openrouter_provider

    # Verifier intentionally has NO fallback — verification must use the
    # strongest available model for factual accuracy. On failure, the GVR
    # loop treats verification_status: "skipped" as MINOR_ISSUES (safe
    # degradation). Using 3.7 Flash at very low temperature for maximum
    # determinism until a 3.7 Pro model becomes available.
    verifier: &verifier_model
      model: ${LLM_SERVICE_VERIFIER_MODEL_NAME, openrouter/google/gemini-3.7-flash}
      temperature: 0.1
      max_tokens: 8000
      num_retries: 3
      extra_body:
        <<: *openrouter_provider

    reviser: &reviser_model
      model: "openrouter/google/gemini-3.7-flash"
      temperature: 0.3
      max_tokens: 12000
      num_retries: 2
      extra_body:
        <<: *openrouter_provider

    # Backward-compatible aliases for gateway and legacy configs
    general: &general_model
      model: "openrouter/google/gemini-3.7-flash"
      extra_body:
        <<: *openrouter_provider

    planning: &planning_model
      model: "openrouter/google/gemini-3.7-flash"
      parallel_tool_calls: true
      max_tokens: ${MAX_TOKENS, 16000}
      temperature: 0.1
      extra_body:
        <<: *openrouter_provider

  - services:
    session_service: &default_session_service
      type: "memory"

    artifact_service: &default_artifact_service
      type: "filesystem"
      base_path: "/tmp/medexpert"
      artifact_scope: namespace

    data_tools_config: &default_data_tools_config
      data_tools_enabled: true
      sqlite_memory_threshold_mb: 100
      max_result_preview_rows: 50
      max_result_preview_bytes: 4096
