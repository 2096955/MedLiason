shared_config:
  - broker_connection: &broker_connection
      dev_mode: ${SOLACE_DEV_MODE, true}
      broker_url: ${SOLACE_BROKER_URL, ws://localhost:8008}
      broker_username: ${SOLACE_BROKER_USERNAME, default}
      broker_password: ${SOLACE_BROKER_PASSWORD, default}
      broker_vpn: ${SOLACE_BROKER_VPN, default}
      temporary_queue: ${USE_TEMPORARY_QUEUES, true}

  # Temperature-tiered model anchors — all versions pinned to -001 to
  # prevent silent behaviour changes when Google updates the model.
  # cache_strategy: "none" disables Google AI Studio's CreateCachedContent
  # API calls, which return 400 errors when using a standard API key
  # Vertex AI ADC — project and location for LiteLLM vertex_ai/ provider.
  # On Cloud Run, ADC uses the service account identity automatically.
  - vertex_ai:
    vertex_project: "gbg-neuro"
    vertex_location: "us-central1"

  - models:
    orchestrator: &orchestrator_model
      model: "vertex_ai/gemini-2.5-flash"
      temperature: 0.2
      max_tokens: 16000
      parallel_tool_calls: true
      cache_strategy: "none"

    specialist: &specialist_model
      model: "vertex_ai/gemini-2.5-flash"
      temperature: 0.3
      max_tokens: 12000
      cache_strategy: "none"

    advisory: &advisory_model
      model: "vertex_ai/gemini-2.5-flash"
      temperature: 0.7
      max_tokens: 12000
      cache_strategy: "none"

    verifier: &verifier_model
      model: ${LLM_SERVICE_VERIFIER_MODEL_NAME, vertex_ai/gemini-2.5-pro}
      temperature: 0.1
      max_tokens: 8000
      cache_strategy: "none"

    reviser: &reviser_model
      model: "vertex_ai/gemini-2.5-flash"
      temperature: 0.3
      max_tokens: 12000
      cache_strategy: "none"

    # Backward-compatible aliases for gateway and legacy configs
    general: &general_model
      model: "vertex_ai/gemini-2.5-flash"
      cache_strategy: "none"

    planning: &planning_model
      model: "vertex_ai/gemini-2.5-flash"
      parallel_tool_calls: true
      max_tokens: ${MAX_TOKENS, 16000}
      temperature: 0.1
      cache_strategy: "none"

  - services:
    session_service: &default_session_service
      type: "memory"

    artifact_service: &default_artifact_service
      type: "filesystem"
      base_path: "/tmp/medexpert"
      artifact_scope: namespace

    data_tools_config: &default_data_tools_config
      data_tools_enabled: true
      sqlite_memory_threshold_mb: 100
      max_result_preview_rows: 50
      max_result_preview_bytes: 4096
