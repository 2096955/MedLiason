# MedExpert - Epidemiology Specialist Agent

log:
  stdout_log_level: INFO
  log_file_level: INFO
  log_file: epidemiology_specialist.log

!include ../shared_config.yaml

apps:
  - name: epidemiology_specialist_app
    app_base_path: .
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE}
      supports_streaming: true
      agent_name: "EpidemiologySpecialist"
      display_name: "Epidemiology Specialist"
      model: *specialist_model

      instruction: |
        You are the Epidemiology Specialist for MedExpert. You analyze disease
        prevalence, mortality, surveillance data, and social determinants of health.

        **DATA SOURCES:**
        - CDC disease surveillance and mortality data
        - SEER cancer statistics
        - Census ACS data for social determinants of health (SDOH)
        - Vaccination coverage data

        **KEY METRICS:**
        - Incidence and prevalence rates
        - Mortality and morbidity statistics
        - Age-adjusted rates
        - Geographic and demographic distributions
        - Temporal trends

        **WORKFLOW:**
        1. Query CDC, SEER, and census databases
        2. Analyze epidemiological trends
        3. Grade the quality of surveillance data
        4. Store findings in memory_plane
        5. Return structured statistical summaries

        You also have access to a knowledge graph via knowledge_graph_tools.
        Use it to explore entity relationships, find connected biomedical
        concepts, and traverse disease-gene-drug-pathway connections when
        relevant to your research domain. Use run_query for Cypher traversals
        and get_schema to understand the graph structure before querying.

      tools:
        - tool_type: mcp
          name: cdc_tools
          connection_params:
            type: sse
            url: "http://localhost:9004/sse"
            timeout: 30

        - tool_type: mcp
          name: seer_tools
          connection_params:
            type: sse
            url: "http://localhost:9006/sse"
            timeout: 30

        - tool_type: mcp
          name: census_sdoh_tools
          connection_params:
            type: sse
            url: "http://localhost:9009/sse"
            timeout: 30

        - tool_type: python
          component_module: lifesci_tools.evidence_grader
          component_base_path: src

        - tool_type: python
          component_module: lifesci_tools.memory_plane
          component_base_path: src
          tool_config:
            redis_url: ${REDIS_URL, redis://localhost:6379/0}
            cold_db_path: ${COLD_DB_PATH, data/medexpert-cold.db}

        - tool_type: mcp
          name: knowledge_graph_tools
          connection_params:
            type: streamable-http
            url: "http://localhost:8000/mcp/"
            timeout: 30

      session_service: *default_session_service
      artifact_service: *default_artifact_service
      max_llm_calls_per_task: 15

      agent_card:
        description: "Epidemiology specialist analyzing disease surveillance, mortality, cancer statistics, and social determinants of health."
        defaultInputModes: ["text"]
        defaultOutputModes: ["text"]
        skills:
          - id: disease_surveillance
            name: Disease Surveillance
            description: Analyzes CDC and SEER disease and cancer surveillance data.
          - id: sdoh_analysis
            name: SDOH Analysis
            description: Examines social determinants of health from Census data.

      agent_card_publishing: { interval_seconds: 10 }
      agent_discovery: { enabled: true }
      inter_agent_communication:
        allow_list: []
        deny_list: ["EpidemiologySpecialist"]
        request_timeout_seconds: 600
