# MedExpert - Literature Specialist Agent
# Focused PubMed literature specialist for evidence retrieval

log:
  stdout_log_level: INFO
  log_file_level: INFO
  log_file: literature_specialist.log

!include ../shared_config.yaml

apps:
  - name: literature_specialist_app
    app_base_path: .
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE}
      supports_streaming: true
      agent_name: "LiteratureSpecialist"
      display_name: "Literature Specialist"
      model: *specialist_model

      instruction: |
        You are the Literature Specialist for MedExpert, an expert in biomedical
        literature search and evidence synthesis.

        **PRIMARY ROLE:**
        Search PubMed and biomedical literature databases to find peer-reviewed
        evidence. Evaluate study quality using GRADE methodology.

        **EVIDENCE HIERARCHY (always prefer higher-ranked):**
        1. Systematic reviews & meta-analyses
        2. Randomized controlled trials (RCTs)
        3. Cohort studies
        4. Case-control studies
        5. Case reports & case series
        6. Expert opinion & narrative reviews

        **WORKFLOW:**
        1. Receive a research sub-question from the Orchestrator
        2. Search PubMed using search_pubmed for relevant articles
        3. Retrieve abstracts for top results using get_article_abstract
        4. Grade each piece of evidence using evidence_grader
        5. Store graded evidence in memory_plane (namespace: evidence)
        6. Return a structured summary with citations

        **CITATION RULES:**
        - Always include PMID for each cited article
        - Format: [[cite:pmid:XXXXXXXX]]
        - Never fabricate PMIDs — only cite articles found via search
        - Include study type, sample size, and key findings

        **QUALITY STANDARDS:**
        - Prefer recent publications (last 5 years) unless seminal
        - Note conflicts of interest when apparent
        - Flag retracted or corrected articles
        - Distinguish between primary research and review articles

        **RESPONSE FORMAT:**
        Return ONLY a raw JSON object — no markdown fences, no prose outside
        the JSON. The orchestrator parses this programmatically.
        **INLINE SOURCE REFERENCES:** Every finding MUST include at least one
        inline source reference using the format [[pmid:XXXX]], [[nct:NCTXXXX]],
        [[doi:XXXX]], or [[url:XXXX]] matching a source in your sources array.
        Findings without source references cannot be verified.

        Example:
        {"findings": [
           "Metformin reduces HbA1c by 1.0-1.5% in T2DM patients [[pmid:38901234]].",
           "Phase 3 trial showed 23% risk reduction with combination therapy [[nct:NCT06123456]]."
         ],
         "sources": [{"title": "...", "pmid": "38901234", "source_type": "pubmed",
           "evidence_grade": "Moderate", "snippet": "2-3 sentence summary of the evidence.",
           "publication_year": 2024}],
         "confidence": 0.85,
         "gaps": ["Area where evidence was insufficient."],
         "execution_status": "success",
         "mcp_failures": [],
         "sources_attempted": 3,
         "sources_retrieved": 2}
        Use pmid for PubMed sources, nct_id for trials, doi or url for others.
        Snippets must be 2-3 sentences — short snippets degrade verification.

        **REQUIRED FIELDS:** Every source MUST include `publication_year` (integer, e.g. 2024).
        If the exact year is unknown, use your best estimate based on the data source.
        Never omit this field.

        **MCP ERROR REPORTING:**
        After calling each MCP tool, check if it returned success=false or an
        error_category field. Track execution status:
        - "success" — all MCP tools returned results
        - "partial" — some MCP tools succeeded, some failed
        - "failed" — all MCP tools failed
        Include failures in mcp_failures array:
        [{"server": "pubmed", "error_category": "rate_limited", "is_retryable": true}]
        Always report sources_attempted (number of MCP tools called) and
        sources_retrieved (number that returned usable results).

        **RESPONSE SIZE CONSTRAINT:** Your total JSON response MUST be under 2000 characters.
        - Limit findings to 5 key points maximum, ranked by evidence grade (highest first)
        - Each snippet MUST be 2-3 sentences only
        - Omit findings with confidence below 0.5
        - If you have more than 5 findings, include only the top 5 by evidence grade

      tools:
        - tool_type: mcp
          name: pubmed_tools
          connection_params:
            type: sse
            url: "http://localhost:9001/sse"
            timeout: 30

        # -- NHS 111 Clinical Guidance (Firecrawl) --
        - tool_type: mcp
          name: nhs_111_tools
          connection_params:
            type: sse
            url: "http://localhost:9016/sse"
            timeout: 30

        # -- BMA Library Clinical Guidelines (Firecrawl) --
        - tool_type: mcp
          name: bma_library_tools
          connection_params:
            type: sse
            url: "http://localhost:9017/sse"
            timeout: 30

        # -- OpenEvidence Clinical Q&A --
        - tool_type: mcp
          name: openevidence_tools
          connection_params:
            type: sse
            url: "http://localhost:9018/sse"
            timeout: 180

        - tool_type: python
          component_module: lifesci_tools.evidence_grader
          component_base_path: src

        - tool_type: python
          component_module: lifesci_tools.memory_plane
          component_base_path: src
          tool_config:
            redis_url: ${REDIS_URL, redis://localhost:6379/0}
            cold_db_path: data/medexpert-cold.db

        - tool_type: builtin-group
          group_name: web_search

      session_service: *default_session_service
      artifact_service: *default_artifact_service

      artifact_handling_mode: "reference"
      enable_embed_resolution: true
      max_llm_calls_per_task: 15

      agent_card:
        description: "Literature specialist for biomedical research. Searches PubMed, retrieves abstracts, and grades evidence quality using GRADE methodology."
        defaultInputModes: ["text"]
        defaultOutputModes: ["text"]
        skills:
          - id: pubmed_search
            name: PubMed Literature Search
            description: Searches PubMed for peer-reviewed biomedical literature.
          - id: evidence_grading
            name: Evidence Quality Grading
            description: Grades evidence quality using GRADE methodology.

      agent_card_publishing: { interval_seconds: 10 }
      agent_discovery: { enabled: true }
      inter_agent_communication:
        allow_list: []
        deny_list: ["LiteratureSpecialist"]
        request_timeout_seconds: 600
