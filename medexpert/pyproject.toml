[project]
name = "medexpert"
version = "0.1.0"
description = "Life Sciences Deep Research Bot built on Solace Agent Mesh"
requires-python = ">=3.10"
dependencies = [
    "solace-agent-mesh>=1.16,<2.0",
    "fastmcp>=2.11,<3.0",
    "httpx>=0.27,<1.0",
    "biopython>=1.83,<2.0",
    "lxml>=5.0,<6.0",
    "redis[hiredis]>=5.0,<6.0",
    "firecrawl-py>=1.5,<2.0",
]

[project.optional-dependencies]
phi = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock",
    "respx>=0.21",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "contract: tests that replay recorded API responses (need cassettes)",
    "system: end-to-end tests requiring a live SAM gateway",
    "cassette_server: marks the MCP server name for cassette lookup",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
