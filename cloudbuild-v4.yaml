steps:
  # Build MedExpert frontend from source (includes model selector)
  - name: "node:22"
    entrypoint: "bash"
    args:
      - "-c"
      - "cd client/webui/frontend && npm ci --ignore-engines && npm run build"

  # Copy built static/ to Docker build context
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - "rm -rf medexpert/frontend-static && cp -r client/webui/frontend/static medexpert/frontend-static"

  # Copy gateway overrides into medexpert build context
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        mkdir -p medexpert/gateway-overrides/routers
        cp src/solace_agent_mesh/gateway/http_sse/main.py medexpert/gateway-overrides/main.py
        cp src/solace_agent_mesh/gateway/http_sse/routers/agent_cards.py medexpert/gateway-overrides/routers/agent_cards.py

  # Docker build (multi-stage Dockerfile.v2)
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/medexpert-v4:${_TAG}"
      - "-t"
      - "gcr.io/$PROJECT_ID/medexpert-v4:latest"
      - "-f"
      - "medexpert/infra/Dockerfile.v2"
      - "medexpert"

  # Push both tags
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/medexpert-v4:${_TAG}"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/medexpert-v4:latest"]

images:
  - "gcr.io/$PROJECT_ID/medexpert-v4:${_TAG}"
  - "gcr.io/$PROJECT_ID/medexpert-v4:latest"

substitutions:
  _TAG: "25bc191f"

timeout: "1200s"

options:
  machineType: "E2_HIGHCPU_8"
