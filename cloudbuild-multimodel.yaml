steps:
  # Build MedExpert frontend from source (includes model selector)
  - name: "node:22"
    entrypoint: "bash"
    args:
      - "-c"
      - "cd client/webui/frontend && npm ci --ignore-engines && npm run build"

  # Copy built static/ to Docker build context
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - "rm -rf medexpert/frontend-static && cp -r client/webui/frontend/static medexpert/frontend-static"

  # Docker build (uses Dockerfile.multimodel with litellm override)
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/medliaison-multimodel:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/medliaison-multimodel:latest"
      - "-f"
      - "medexpert/infra/Dockerfile.multimodel"
      - "medexpert"

  # Push
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/medliaison-multimodel:$COMMIT_SHA"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/medliaison-multimodel:latest"]

images:
  - "gcr.io/$PROJECT_ID/medliaison-multimodel:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/medliaison-multimodel:latest"

timeout: "1200s"

options:
  machineType: "E2_HIGHCPU_8"
